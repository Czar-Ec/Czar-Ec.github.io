name: Deploy to LIVE
on:
  push:
    branches: [pre-deploy]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      # install ubuntu deps

      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # install deps
      - run: yarn install

      # build
      - run: yarn build:prod --output-path deploy

      - name: Replace <base href="/"> with <base href=".">
        run: |
          echo "Replacing <base href=\"/\"> with <base href=\".\"> in dist folder..."
          find deploy -type f -name "index.html" -print -exec sed -i 's|<base href="/">|<base href=".">|' {} \;

      # push to master
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          branch: master # The branch the action should deploy to.
          folder: deploy/browser # The folder the action should deploy.
